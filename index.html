<style>

 --display:"Reem Kufi","Cairo",Tahoma,sans-serif;--body:"Cairo","Segoe UI",Tahoma,sans-serif}

:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:10px}

.opt[aria-pressed="true"]{border-color:var(--c1);background:#eefbf3}
select{width:100%;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px}
.btn{border:0;border-radius:14px;padding:9px 22px;font-weight:800;background:linear-gradient(110deg,var(--c1),var(--c2));color:#fff}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.members{display:flex;gap:8px;flex-wrap:wrap}
.mem{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 12px;background:#eefbf3;border:1px solid #bfe8cf;font-weight:700;font-size:.9rem}

.part .e{font-size:1.7rem}

.part small{color:var(--muted);font-weight:700}
.q{display:flex;flex-direction:column;gap:8px}
.ans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.ans button,.pool button,.bins button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;text-align:start;font-weight:700}
.ans button[aria-pressed="true"],.bins button[aria-pressed="true"]{border-color:#0ea5e9;background:#eaf6fd}
.right{border-color:var(--ok)!important;background:var(--oks)!important}
.wrong{border-color:var(--bad)!important;background:var(--bads)!important}
.fb{border-radius:12px;padding:6px 12px;font-weight:700;font-size:.92rem}
.fb.ok{background:var(--oks);color:var(--ok)}.fb.no{background:var(--bads);color:var(--bad)}
.slot{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:12px;padding:8px 10px;min-height:44px;background:#f3f6f5}
.slot .n{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--pc);font-weight:800}
.slot.filled{border-style:solid;background:#fff;cursor:pointer}
.pool{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 10px}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}
.scard{display:flex;flex-direction:column;gap:6px;border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.bins{display:flex;gap:8px;flex-wrap:wrap}
.bins button{flex:1;min-width:100px;text-align:center}
.who{font-size:.75rem;color:var(--muted);font-weight:700}
.score{text-align:center;align-items:center}
.score .big{font-family:var(--display);font-size:2.6rem;color:var(--c1);line-height:1.1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:40;background:var(--ink);color:#fff;padding:8px 18px;border-radius:12px;font-weight:700;max-width:calc(100vw - 32px);text-align:center}

.chips{display:flex;gap:5px;flex-wrap:wrap}

.tmcard{border:2px solid var(--sun)}
@media print{.tclock{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  return '<article class="card team"><div class="hd"><span class="e">'+t[1]+'</span><div><b>'+t[0]+'</b><div class="muted" style="font-size:.8rem">'+(d?(fresh?'🟢 تحل الآن':'⚪ آخر نشاط قبل دقائق'):'لم تدخل بعد')+'</div></div><span class="pts">'+AR(tot)+'<small class="muted" style="font-size:.7rem"> / '+AR(max)+'</small></span></div>'+(d?'<div class="members">'+[...new Set(d.m||[])].map(n=>'<span class="mem"><i></i>'+esc(n)+'</span>').join('')+'</div>':'')+helpHTML(i+1,d)+(d?'<button class="btn ghost" data-watch="'+(i+1)+'" style="padding:4px 14px">👁️ ادخلي على المجموعة وتابعي حلّهم</button>':'')+'<div class="chips">'+L.parts.map((p,k)=>{const s=d&&d.done?d.done[k]:null;return '<span class="'+(s!=null?'ok':d&&d.part===k?'now':'')+'">'+p.e+' '+AR(k+1)+(s!=null?': '+AR(s)+'/'+AR(PM(p)):d&&d.part===k?' ✏️':'')+'</span>'}).join('')+'</div></article>'}).join('')+'</div>'+savedHTML();
 return h+foot}
const W={g:0,G:null,ch:null};
function stopWatch(){try{W.ch&&SB.removeChannel(W.ch)}catch(e){}W.ch=null;W.g=0;W.G=null}
function startWatch(g){if(!SB)return;stopWatch();W.g=g;const c=W.ch=SB.channel('g-'+LESSONS[T.l].key+'-'+T.c.replace('/','_')+'-'+g,{config:{broadcast:{self:false},presence:{key:'teacher-'+Math.random().toString(36).slice(2,7)}}});
 c.on('broadcast',{event:'state'},({payload})=>{if(c!==W.ch||!payload)return;if(!W.G||payload.v>=W.G.v){W.G=payload;render()}}).subscribe(s=>{if(s==='SUBSCRIBED'&&c===W.ch){c.track({name:'المعلمة',t:1,at:Date.now()});c.send({type:'broadcast',event:'hello',payload:{}});setTimeout(()=>{if(c===W.ch&&!W.G)c.send({type:'broadcast',event:'hello',payload:{}})},3000)}});render(true)}
function vWatch(){const L=LESSONS[T.l],g=W.g,t=L.teams[g-1],d=T.teams[g]||{},max=L.parts.reduce((a,p)=>a+PM(p),0);
 let h='<nav class="topbar"><span class="tb-t">👁️ متابعة مجموعة</span><button class="tbtn ghost" data-unwatch style="border:0">↩ رجوع للوحة المعلمة</button></nav>'+hero(L,'👁️ أنتِ الآن مع المجموعة: الطالبات يشوفون إنك معهم، وأنتِ تشوفين حلّهم مباشرة');
 h+='<section class="card"><div class="row" style="justify-content:space-between"><b style="font-size:1.1rem">'+t[1]+' '+t[0]+' · الشعبة <bdi>'+AR(T.c)+'</bdi></b><span class="wbadge">'+(d.cls?'🏫 جهاز المجموعة':'🏠 كل طالبة من جهازها')+'</span></div><div class="members">'+[...new Set(d.m||[])].map(n=>'<span class="mem"><i></i>'+esc(n)+'</span>').join('')+'</div>'+helpHTML(g,d)+'<div class="row">'+L.teams.map((x,k)=>T.teams[k+1]?'<button class="btn '+(k+1===g?'':'ghost')+'" data-watch="'+(k+1)+'" style="padding:4px 12px">'+x[1]+' '+AR(k+1)+'</button>':'').join('')+'</div></section>';
 if(!W.G)return h+'<section class="card"><p class="muted">⏳ جاري جلب حل المجموعة… إذا ما ظهر شي، يمكن ما بدأوا يحلّون بعد.</p></section>'+foot;
 const sp=P,sg=G;try{P={l:T.l,c:T.c,g:g,n:'__teacher__',mode:d.cls?'class':'solo',m:(d.m&&d.m.length?d.m:['—'])};G=W.G;norm();
  const tot=Object.values(G.done).reduce((a,b)=>a+b,0);
  h+='<section class="card"><div class="row" style="justify-content:space-between"><h2 class="sec">وين وصلوا؟</h2><span class="status on" style="background:#eef3f1;color:var(--ink)">درجة المجموعة: '+AR(tot)+' من '+AR(max)+'</span></div>'+(d.cls&&P.m.length?'<p>🎯 الدور الآن على: <b>'+esc(P.m[(G.turn||0)%P.m.length])+'</b></p>':'')+(G.by?'<p class="muted">✏️ آخر إجابة من: <b>'+esc(G.by)+'</b></p>':'')+'<div class="chips">'+L.parts.map((p,k)=>{const sc=G.done[k];return '<span class="'+(sc!=null?'ok':G.part===k?'now':'')+'">'+p.e+' '+AR(k+1)+(sc!=null?': '+AR(sc)+'/'+AR(PM(p)):G.part===k?' ✏️ يحلّون الآن':'')+'</span>'}).join('')+'</div>'+(Object.keys(G.contrib||{}).length?'<p class="muted" style="font-size:.85rem">المشاركة: '+Object.entries(G.contrib).sort((a,b)=>b[1]-a[1]).map(([n,c])=>esc(n)+' ('+AR(c)+')').join('، ')+'</p>':'')+'</section>';
  h+=G.part==null?'<section class="card"><p class="muted">المجموعة الآن في قائمة الأنشطة، ما فتحوا نشاط بعد.</p></section>':'<div class="watch" style="display:flex;flex-direction:column;gap:12px">'+vPart()+'</div>'}finally{P=sp;G=sg}
 return h+foot}
function teacherJoin(){if(!SB){toast('تعذّر الاتصال');return}try{tch&&SB.removeChannel(tch)}catch(e){}T.teams={};
 tch=SB.channel('lobby-'+LESSONS[T.l].key+'-'+T.c.replace('/','_'),{config:{broadcast:{self:false}}});
 tch.on('broadcast',{event:'ping'},()=>{if(TM.end>Date.now())sendTimer()}).on('broadcast',{event:'prog'},({payload})=>{if(!payload||!payload.g)return;const o=T.teams[payload.g];if(payload.help&&(!o||o.help!==payload.help)&&Date.now()-payload.help<15*60000)toast('✋ '+tname(payload.g)+' تطلب مساعدة');T.teams[payload.g]=payload;const f=document.activeElement;if(!(f&&/^(tdate|tmc)$/.test(f.id)))render()}).subscribe(s=>{if(s==='SUBSCRIBED')tch.send({type:'broadcast',event:'ping',payload:{}})});loadSaved()}
function render(scrollTop){
 if(location.hash==='#teacher'){const y=scrollY;root.innerHTML=vTeacher();if(scrollTop)scrollTo(0,0);else scrollTo(0,y);return}
 const y=scrollY;root.innerHTML=view==='room'&&G?vRoom():vStart();if(scrollTop)scrollTo(0,0);else scrollTo(0,y)}
root.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-un]');if(!t)return;const d=t.dataset;
 if(location.hash==='#teacher'){
  if('tok' in d){if(document.getElementById('tc').value.trim()===TCODE){T.ok=true;T.code=TCODE;render();teacherJoin()}else toast('الرمز غير صحيح')}
  if('ping' in d){teacherJoin();render()}
  if('board' in d){T.board=!T.board;render(true);if(T.board)try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}else try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}
  if(d.hok){const g=+d.hok;try{tch&&tch.send({type:'broadcast',event:'helpok',payload:{g}})}catch(e){}if(T.teams[g])T.teams[g].help=0;render()}
  if(d.tm)startTm(+d.tm);
  if('tmc' in d){const v=Math.round(+document.getElementById('tmc').value);if(v>=1&&v<=90)startTm(v);else toast('اكتبي عدد الدقائق من ١ إلى ٩٠')}
  if('tmadd' in d&&TM.end>Date.now()){TM.end+=60000;TM.dur+=60000;tmRang=false;sendTimer();render();toast('➕ انضافت دقيقة')}
  if('tmstop' in d){setTimer(0,0);sendTimer();render();toast('⏹ توقف الوقت')}
  if(d.watch){startWatch(+d.watch);return}
  if('unwatch' in d){stopWatch();render(true);return}
  if('csv' in d)dlCSV();
  if('print' in d)print();
  if('reload' in d)loadSaved();
  return}
 if(view!=='room'){
  if('resume' in d){joinRoom();scrollTo(0,0);return}
  if(d.l!=null){P.l=+d.l;step=1;render(true);return}
  if(d.c){P.c=d.c;step=2;render(true);return}
  if('back' in d){step=step===4&&isC()?2:step===5?4:Math.max(0,step-1);render(true);return}
  if(d.mode){P.mode=d.mode;step=d.mode==='class'?4:3;render(true);return}
  if('next' in d){const v=document.getElementById('nm').value.trim().replace(/\s+/g,' ');if(v.length<2){toast('اكتبي اسمك أولًا');return}P.n=v;step=4;render(true);return}
  if(d.g){P.g=+d.g;if(isC()){step=5;render(true);return}LS.set('me',P);joinRoom();scrollTo(0,0);return}
  if('mgo' in d){const ns=[];ROLES.forEach((r,k)=>{const v=(document.getElementById('mn'+k).value||'').trim().replace(/\s+/g,' ');if(v.length>=2&&!ns.includes(v))ns.push(v)});if(ns.length<2){toast('اكتبن اسمين على الأقل');return}P.m=ns;P.mg=P.g;P.mc=P.c;P.n='جهاز '+LESSONS[P.l].teams[P.g-1][0];LS.set('me',P);joinRoom();scrollTo(0,0);return}
  return}
 if('exit' in d){leaveRoom();view='start';step=0;render(true);toast('🚪 خرجتِ من المجموعة. تقدرين تختارين من جديد');return}
 if(d.turn!=null&&isC()){G.turn=+d.turn;commit();renderMembers();toast('🎯 الدور الآن على '+first(P.m[G.turn]));return}
 if('help' in d){G.help=G.help&&Date.now()-G.help<15*60000?0:Date.now();commit();renderMembers();toast(G.help?'✋ وصل طلبكم للمعلمة':'تم إلغاء طلب المساعدة');return}
 if(d.p!=null){G.part=+d.p;commit();render(true);return}
 if('list' in d){G.part=null;commit();render(true);return}
 const i=G.part;if(i==null)return;const L=LESSONS[P.l],p=L.parts[i],a=A();
 if('retry' in d){delete G.done[i];G.ans[i]={};commit();render();return}
 if(G.done[i]!=null)return;
 if(d.add!=null){NEWFILL=true;(a.seq=a.seq||[]).push(+d.add);chg(i);return}
 if(d.un!=null){a.seq.splice(+d.un,1);chg(i);return}
 if('clear' in d){a.seq=[];chg(i);return}
 if(d.s!=null&&d.b!=null){NEWFILL=a[+d.s]==null;a[+d.s]=+d.b;chg(i);return}
 if(d.q!=null&&d.o!=null){NEWFILL=a[+d.q]==null;a[+d.q]=+d.o;chg(i);return}
 if(d.cv!=null&&isC()){if(!complete(p,a))return;G.done[i]=grade(p,a);delete G.votes[i];commit(P.m[0]);saveRes(i,G.done[i],PM(p));setTimeout(()=>celebrate(G.done[i]===PM(p)),60);render();return}
 if('check' in d){if(!complete(p,a))return;const v=G.votes[i]=G.votes[i]||{};v[P.n]=1;const pr=present(),yes=pr.filter(n=>v[n]).length;
  if(yes*2>pr.length){G.done[i]=grade(p,a);delete G.votes[i];commit();saveRes(i,G.done[i],PM(p));setTimeout(()=>celebrate(G.done[i]===PM(p)),60)}else{commit();toast('🗳️ انحسب صوتك، ننتظر موافقة زميلاتك')}render();return}
});
root.addEventListener('change',e=>{const t=e.target;
 if(t.id==='tl'){T.l=+t.value;teacherJoin();render();return}
 if(t.id==='tcls'){T.c=t.value;teacherJoin();render();return}
 if(t.id==='tdate'){T.date=t.value;render();return}
 if(t.dataset.m!=null&&G&&G.part!=null&&G.done[G.part]==null){const a=A();if(t.value==='')delete a[+t.dataset.m];else{NEWFILL=a[+t.dataset.m]==null;a[+t.dataset.m]=+t.value}chg(G.part)}});
root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.un!=null){e.preventDefault();e.target.click()}});
addEventListener('hashchange',()=>render(true));
setInterval(()=>{const f=document.activeElement;if(location.hash==='#teacher'&&T.ok&&!(f&&/^(tdate|tmc)$/.test(f.id)))render()},15000);
setInterval(()=>{if(location.hash==='#teacher'&&T.ok)loadSaved()},45000);
render();
})();
</script>
