<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>موقع الأنشطة الجماعية · أحياء ١</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Reem+Kufi:wght@600;700&display=swap">
<style>
:root{--bg:#f6f8f7;--card:#fff;--line:#dfe7e3;--ink:#17261f;--muted:#5f7068;--c1:#15803d;--c2:#0d9488;--ok:#059669;--oks:#d1fae5;--bad:#e11d48;--bads:#ffe4e6;--sun:#f59e0b;
 --display:"Reem Kufi","Cairo",Tahoma,sans-serif;--body:"Cairo","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
h1,h2,h3{margin:0;line-height:1.35;text-wrap:balance}p{margin:0}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:10px}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 60px;display:flex;flex-direction:column;gap:14px}
.hero{border-radius:22px;padding:16px 20px;color:#fff;background:linear-gradient(120deg,var(--c1),var(--c2));display:flex;gap:14px;align-items:center;box-shadow:0 12px 30px rgb(0 0 0/.15)}
.hero .e{font-size:2.6rem;width:64px;height:64px;border-radius:20px;background:rgb(255 255 255/.2);display:grid;place-items:center;flex:none}
.hero h1{font-family:var(--display);font-size:clamp(1.4rem,4.5vw,2rem)}
.hero small{display:block;font-weight:700;opacity:.95}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgb(0 0 0/.04),0 8px 22px rgb(0 0 0/.06);display:flex;flex-direction:column;gap:10px}
.sec{font-family:var(--display);font-size:1.2rem;color:var(--c1)}
.muted{color:var(--muted)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px;font-weight:800;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.opt .e{font-size:2rem;line-height:1}
.opt[aria-pressed="true"]{border-color:var(--c1);background:#eefbf3}
select{width:100%;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px}
.btn{border:0;border-radius:14px;padding:9px 22px;font-weight:800;background:linear-gradient(110deg,var(--c1),var(--c2));color:#fff}
.btn.ghost{background:#eef3f1;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.members{display:flex;gap:8px;flex-wrap:wrap}
.mem{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 12px;background:#eefbf3;border:1px solid #bfe8cf;font-weight:700;font-size:.9rem}
.mem i{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgb(34 197 94/.2)}
.mem.me{background:#fff7e0;border-color:#f5d48a}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;border-radius:999px;padding:0 10px}
.status.on{background:var(--oks);color:var(--ok)}.status.off{background:var(--bads);color:var(--bad)}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.part{border:2px solid var(--line);border-top:6px solid var(--pc);background:#fff;border-radius:16px;padding:10px 12px;text-align:start;display:flex;flex-direction:column;gap:2px}
.part .e{font-size:1.7rem}
.part.done{background:var(--oks);border-color:var(--ok)}
.part small{color:var(--muted);font-weight:700}
.q{display:flex;flex-direction:column;gap:8px}
.ans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.ans{grid-template-columns:1fr}}
.ans button,.pool button,.bins button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;text-align:start;font-weight:700}
.ans button[aria-pressed="true"],.bins button[aria-pressed="true"]{border-color:#0ea5e9;background:#eaf6fd}
.right{border-color:var(--ok)!important;background:var(--oks)!important}
.wrong{border-color:var(--bad)!important;background:var(--bads)!important}
.fb{border-radius:12px;padding:6px 12px;font-weight:700;font-size:.92rem}
.fb.ok{background:var(--oks);color:var(--ok)}.fb.no{background:var(--bads);color:var(--bad)}
.slot{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:12px;padding:8px 10px;min-height:44px;background:#f3f6f5}
.slot .n{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--pc);font-weight:800}
.slot.filled{border-style:solid;background:#fff;cursor:pointer}
.pool{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 10px}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}
.scard{display:flex;flex-direction:column;gap:6px;border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.bins{display:flex;gap:8px;flex-wrap:wrap}
.bins button{flex:1;min-width:100px;text-align:center}
.who{font-size:.75rem;color:var(--muted);font-weight:700}
.score{text-align:center;align-items:center}
.score .big{font-family:var(--display);font-size:2.6rem;color:var(--c1);line-height:1.1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:40;background:var(--ink);color:#fff;padding:8px 18px;border-radius:12px;font-weight:700;max-width:calc(100vw - 32px);text-align:center}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.team .hd{display:flex;gap:10px;align-items:center}
.team .hd .e{font-size:1.8rem}
.team .pts{margin-inline-start:auto;font-family:var(--display);font-size:1.4rem;color:var(--c1)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips span{font-size:.78rem;font-weight:700;border-radius:999px;padding:0 9px;border:1px solid var(--line);background:#f3f6f5}
.chips span.ok{background:var(--oks);border-color:var(--ok);color:var(--ok)}
.chips span.now{border-color:var(--sun);background:#fff7e0}
.foot{text-align:center;color:var(--muted);font-size:.8rem}
img.qimg{max-width:100%;border-radius:12px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){

let G=null, ch=null, lobby=null, peers=[], online=false, view='list';

function vRoom(){const L=LESSONS[P.l];theme(L);

 if(G.part==null){
  const tot=Object.values(G.done).reduce((a,b)=>a+b,0),max=L.parts.reduce((a,p)=>a+PM(p),0);
  h+='<section class="card"><div class="row" style="justify-content:space-between"><h2 class="sec">أجزاء النشاط</h2><span class="status on" style="background:#eef3f1;color:var(--ink)">درجة المجموعة: '+AR(tot)+' من '+AR(max)+'</span></div><p class="muted">اختاروا جزءًا معًا، وسيفتح عند كل أعضاء المجموعة.</p><div class="parts">'+L.parts.map((p,i)=>{const d=G.done[i];return '<button class="part'+(d!=null?' done':'')+'" style="--pc:'+p.color+'" data-p="'+i+'"><span class="e">'+p.e+'</span><small>الجزء '+AR(i+1)+'</small><b>'+p.t+'</b><small>'+(d!=null?'✓ '+AR(d)+' من '+AR(PM(p)):AR(PM(p))+' درجات')+'</small></button>'}).join('')+'</div></section>';
  h+='<div class="row"><button class="btn ghost" data-exit>↩ تغيير النشاط أو المجموعة</button></div>'}
 else h+=vPart();
 return h+foot}
function A(){const k=G.part;return G.ans[k]||(G.ans[k]={})}
function vPart(){
 const L=LESSONS[P.l],i=G.part,p=L.parts[i],a=A(),chk=G.done[i]!=null;
 let h='<section class="card" style="border-top:6px solid '+p.color+';--pc:'+p.color+'"><small class="muted" style="font-weight:800">الجزء '+AR(i+1)+' '+p.e+'</small><h2 style="font-size:1.2rem">'+p.t+'</h2>'+(p.intro?'<p class="muted">'+p.intro+'</p>':'')+'</section><div style="--pc:'+p.color+';display:flex;flex-direction:column;gap:12px">';
 if(p.type==='order'){const n=p.items.length,ord=shuf(i*31+7,n),seq=a.seq||[];
  h+='<section class="card q"><h3>ترتيب المجموعة:</h3>'+[...Array(n).keys()].map(k=>{const v=seq[k];const c=chk?(v===k?' right':' wrong'):'';return '<div class="slot'+(v!=null?' filled':'')+c+'"'+(v!=null&&!chk?' data-un="'+k+'" role="button" tabindex="0"':'')+'><span class="n">'+AR(k+1)+'</span><span>'+(v!=null?p.items[v]:'<span class="muted">…</span>')+'</span></div>'}).join('');
  if(!chk)h+='<h3>الخطوات (اضغطن بالترتيب):</h3><div class="pool">'+ord.filter(v=>!seq.includes(v)).map(v=>'<button data-add="'+v+'">'+p.items[v]+'</button>').join('')+'</div>';
  else h+='<div class="fb ok">💡 '+(G.done[i]===n?'ترتيب صحيح! ':'الترتيب الصحيح: '+p.items.map((x,k)=>AR(k+1)+') '+x).join(' ← ')+'. ')+p.exp+'</div>';
  h+='</section>'}
 else if(p.type==='match'){const ord=shuf(i*17+3,p.pairs.length);
  h+='<section class="card q">'+p.pairs.map((pr,k)=>{const v=a[k];const c=chk?(v===k?' right':' wrong'):'';return '<div class="mrow'+c+'"><b>'+pr[0]+'</b><div>'+(chk?'<span>'+(v!=null?p.pairs[v][1]:'—')+'</span>'+(v!==k?'<div class="fb ok">✓ '+pr[1]+'</div>':''):'<select id="m'+i+'_'+k+'" data-m="'+k+'" aria-label="'+esc(pr[0])+'"><option value="">— اختاري —</option>'+ord.map(o=>'<option value="'+o+'"'+(v===o?' selected':'')+'>'+p.pairs[o][1]+'</option>').join('')+'</select>')+'</div></div>'}).join('')+(chk?'<div class="fb ok">💡 '+p.exp+'</div>':'')+'</section>'}
 else if(p.type==='sort'){
  h+='<section class="card q">'+p.cards.map((cd,k)=>{const v=a[k];return '<div class="scard"><b>'+AR(k+1)+'. '+cd[0]+'</b><div class="bins">'+p.bins.map((b,bi)=>{let c='';if(chk){if(bi===cd[1])c='right';else if(v===bi)c='wrong'}return '<button data-s="'+k+'" data-b="'+bi+'" aria-pressed="'+(v===bi)+'"'+(c?' class="'+c+'"':'')+(chk?' disabled':'')+'>'+b+'</button>'}).join('')+'</div></div>'}).join('')+(chk?'<div class="fb ok">💡 '+p.exp+'</div>':'')+'</section>'}
 else{p.q.forEach((Q,qi)=>{const ord=Q[1].length===2?[0,1]:shuf(i*101+qi*13+5,Q[1].length);const pk=a[qi];
  h+='<section class="card q"><h3>'+AR(qi+1)+'. '+Q[0]+'</h3>'+(Q[4]?'<img class="qimg" src="'+Q[4]+'" alt="">':'')+'<div class="ans">'+ord.map(oi=>{let c='';if(chk){if(oi===Q[2])c='right';else if(pk===oi)c='wrong'}return '<button data-q="'+qi+'" data-o="'+oi+'" aria-pressed="'+(pk===oi)+'"'+(c?' class="'+c+'"':'')+(chk?' disabled':'')+'>'+Q[1][oi]+'</button>'}).join('')+'</div>'+(chk?'<div class="fb '+(pk===Q[2]?'ok">✓ ':'no">✗ ')+Q[3]+'</div>':'')+'</section>'})}
 h+='</div>';
 if(!chk){const full=complete(p,a);h+='<div class="row"><button class="btn ghost" data-list>↩ أجزاء النشاط</button>'+(p.type==='order'&&(a.seq||[]).length?'<button class="btn ghost" data-clear>مسح الترتيب</button>':'')+'<button class="btn" data-check'+(full?'':' disabled')+'>تصحيح ✔</button>'+(full?'':'<span class="muted">أكملن كل الإجابات أولًا</span>')+'</div>'+(G.by?'<p class="who">آخر تعديل: '+esc(first(G.by))+'</p>':'')}
 else{const sc=G.done[i],pm=PM(p);h+='<section class="card score"><div style="font-size:1.5rem">'+'⭐'.repeat(Math.round(sc/pm*5))+'</div><div class="big">'+AR(sc)+' من '+AR(pm)+'</div><p>'+(sc===pm?'ممتاز! العلامة الكاملة للمجموعة 🎉':'راجعن التصحيح معًا 💪')+'</p><div class="row" style="justify-content:center"><button class="btn ghost" data-retry>إعادة المحاولة</button><button class="btn" data-list>العودة لأجزاء النشاط</button></div></section>'}
 return h}
function complete(p,a){if(p.type==='order')return (a.seq||[]).length===p.items.length;const n=PM(p);for(let k=0;k<n;k++)if(a[k]==null)return false;return true}
function grade(p,a){if(p.type==='order')return a.seq.reduce((s,v,k)=>s+(v===k?1:0),0);if(p.type==='match')return p.pairs.reduce((s,_,k)=>s+(a[k]===k?1:0),0);if(p.type==='sort')return p.cards.reduce((s,c,k)=>s+(a[k]===c[1]?1:0),0);return p.q.reduce((s,Q,k)=>s+(a[k]===Q[2]?1:0),0)}
let T={l:0,c:CLASSES[0],ok:false,teams:{}},tch=null;
function vTeacher(){const L=LESSONS[T.l];theme(L);
 let h=hero(L,'📋 لوحة المعلمة: تتابعين المجموعات وهي تحل مباشرة');
 if(!T.ok){return h+'<section class="card"><label for="tc" style="font-weight:800">رمز المعلمة</label><input id="tc" inputmode="numeric" style="border:2px solid var(--line);border-radius:12px;padding:8px 12px"><div class="row"><button class="btn" data-tok>دخول</button><a class="btn ghost" href="#" style="text-decoration:none">رجوع</a></div></section>'+foot}
 h+='<section class="card"><div class="row"><label style="font-weight:800" for="tl">النشاط</label><select id="tl" style="width:auto">'+LESSONS.map((l,i)=>'<option value="'+i+'"'+(i===T.l?' selected':'')+'>'+l.title+'</option>').join('')+'</select><label style="font-weight:800" for="tcls">الشعبة</label><select id="tcls" style="width:auto">'+CLASSES.map(c=>'<option value="'+c+'"'+(c===T.c?' selected':'')+'>'+AR(c)+'</option>').join('')+'</select><button class="btn ghost" data-ping>🔄 تحديث</button></div><p class="muted" style="font-size:.85rem">تظهر هنا المجموعات المفتوحة الآن على أجهزة الطالبات. الصفحة لا تحفظ النتائج، فخلّيها مفتوحة أثناء الحصة.</p></section>';
 const max=L.parts.reduce((a,p)=>a+PM(p),0);
 h+='<div class="teams">'+L.teams.map((t,i)=>{const d=T.teams[i+1];const fresh=d&&Date.now()-d.t<120000;const tot=d?Object.values(d.done||{}).reduce((a,b)=>a+b,0):0;
  return '<article class="card team"><div class="hd"><span class="e">'+t[1]+'</span><div><b>'+t[0]+'</b><div class="muted" style="font-size:.8rem">'+(d?(fresh?'🟢 تحل الآن':'⚪ آخر نشاط قبل دقائق'):'لم تدخل بعد')+'</div></div><span class="pts">'+AR(tot)+'<small class="muted" style="font-size:.7rem"> / '+AR(max)+'</small></span></div>'+(d?'<div class="members">'+[...new Set(d.m||[])].map(n=>'<span class="mem"><i></i>'+esc(n)+'</span>').join('')+'</div>':'')+'<div class="chips">'+L.parts.map((p,k)=>{const s=d&&d.done?d.done[k]:null;return '<span class="'+(s!=null?'ok':d&&d.part===k?'now':'')+'">'+p.e+' '+AR(k+1)+(s!=null?': '+AR(s)+'/'+AR(PM(p)):d&&d.part===k?' ✏️':'')+'</span>'}).join('')+'</div></article>'}).join('')+'</div>';
 return h+foot}
function teacherJoin(){if(!SB){toast('تعذّر الاتصال');return}try{tch&&SB.removeChannel(tch)}catch(e){}T.teams={};
 tch=SB.channel('lobby-'+LESSONS[T.l].key+'-'+T.c.replace('/','_'),{config:{broadcast:{self:false}}});
 tch.on('broadcast',{event:'prog'},({payload})=>{if(!payload||!payload.g)return;T.teams[payload.g]=payload;render()}).subscribe(s=>{if(s==='SUBSCRIBED')tch.send({type:'broadcast',event:'ping',payload:{}})})}
function render(scrollTop){
 if(location.hash==='#teacher'){root.innerHTML=vTeacher();return}
 const y=scrollY;root.innerHTML=view==='room'&&G?vRoom():vStart();if(scrollTop)scrollTo(0,0);else scrollTo(0,y)}
root.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-un]');if(!t)return;const d=t.dataset;
 if(location.hash==='#teacher'){
  if('tok' in d){if(document.getElementById('tc').value.trim()===TCODE){T.ok=true;render();teacherJoin()}else toast('الرمز غير صحيح')}
  if('ping' in d){teacherJoin();render()}
  return}
 if(view!=='room'){
  if(d.l!=null){P.l=+d.l;step=1;render(true);return}
  if(d.c){P.c=d.c;step=2;render(true);return}
  if('back' in d){step=Math.max(0,step-1);render(true);return}
  if('next' in d){const v=document.getElementById('nm').value.trim().replace(/\s+/g,' ');if(v.length<2){toast('اكتبي اسمك أولًا');return}P.n=v;step=3;render(true);return}
  if(d.g){P.g=+d.g;LS.set('me',P);joinRoom();scrollTo(0,0);return}
  return}
 if('exit' in d){leaveRoom();view='start';step=0;render(true);return}
 if(d.p!=null){G.part=+d.p;commit();render(true);return}
 if('list' in d){G.part=null;commit();render(true);return}
 const i=G.part;if(i==null)return;const L=LESSONS[P.l],p=L.parts[i],a=A();
 if('retry' in d){delete G.done[i];G.ans[i]={};commit();render();return}
 if(G.done[i]!=null)return;
 if(d.add!=null){(a.seq=a.seq||[]).push(+d.add);commit();render();return}
 if(d.un!=null){a.seq.splice(+d.un,1);commit();render();return}
 if('clear' in d){a.seq=[];commit();render();return}
 if(d.s!=null&&d.b!=null){a[+d.s]=+d.b;commit();render();return}
 if(d.q!=null&&d.o!=null){a[+d.q]=+d.o;commit();render();return}
 if('check' in d){G.done[i]=grade(p,a);commit();render();return}
});
root.addEventListener('change',e=>{const t=e.target;
 if(t.id==='tl'){T.l=+t.value;teacherJoin();render();return}
 if(t.id==='tcls'){T.c=t.value;teacherJoin();render();return}
 if(t.dataset.m!=null&&G&&G.part!=null&&G.done[G.part]==null){const a=A();if(t.value==='')delete a[+t.dataset.m];else a[+t.dataset.m]=+t.value;commit();render()}});
root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.un!=null){e.preventDefault();e.target.click()}});
addEventListener('hashchange',()=>render(true));
setInterval(()=>{if(location.hash==='#teacher'&&T.ok)render()},15000);
if(location.hash!=='#teacher'&&P.l!=null&&P.c&&P.n&&P.g&&LESSONS[P.l])joinRoom();else render();
})();
</script>
